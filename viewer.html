<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iMessage Vault</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #e2e2e5;
    --text: #1c1c1e;
    --text-secondary: #8a8a8e;
    --bubble-me: #007aff;
    --bubble-me-text: #ffffff;
    --bubble-them: #e9e9eb;
    --bubble-them-text: #1c1c1e;
    --accent: #007aff;
    --hover: #eef0f3;
    --selected: #dfe8fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --panel: #232326;
      --border: #333336;
      --text: #f2f2f2;
      --text-secondary: #9a9a9e;
      --bubble-me: #0a84ff;
      --bubble-me-text: #ffffff;
      --bubble-them: #3a3a3d;
      --bubble-them-text: #f2f2f2;
      --accent: #0a84ff;
      --hover: #2c2c2f;
      --selected: #2a3a52;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; }

  #sidebar {
    width: 320px;
    min-width: 240px;
    max-width: 45%;
    resize: horizontal;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--panel);
  }
  #sidebar-header {
    padding: 14px 14px 8px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 {
    font-size: 17px;
    margin: 0 0 10px;
  }
  #search {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  #meta {
    font-size: 12px;
    color: var(--text-secondary);
    padding: 6px 14px 0;
  }
  #spam-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 8px;
    cursor: pointer;
  }
  #spam-toggle input { cursor: pointer; }
  #screen-time-filter {
    display: block;
    width: 100%;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 6px;
    cursor: pointer;
  }
  #chat-list {
    overflow-y: auto;
    flex: 1;
  }
  .chat-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .chat-item:hover { background: var(--hover); }
  .chat-item.selected { background: var(--selected); }
  .chat-item .row1 {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .chat-item .name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .auto-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: var(--hover);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 4px;
    vertical-align: middle;
  }
  .chat-item .date {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .chat-item .preview {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #thread {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #thread-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  #thread-header .row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #thread-header .name { font-size: 15px; font-weight: 600; }
  #thread-header .sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  #spam-btn {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
  }
  #spam-btn:hover { background: var(--hover); }
  #spam-btn.is-spam { color: #ff3b30; border-color: #ff3b30; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .day-divider {
    text-align: center;
    font-size: 11px;
    color: var(--text-secondary);
    margin: 18px 0 10px;
  }
  .msg-row {
    display: flex;
    margin-bottom: 3px;
  }
  .msg-row.me { justify-content: flex-end; }
  .msg-row.them { justify-content: flex-start; }
  .bubble-wrap { max-width: 68%; }
  .msg-time {
    font-size: 10.5px;
    color: var(--text-secondary);
    margin: 2px 6px 0;
  }
  .msg-row.me .msg-time { text-align: right; }
  .sender-label {
    font-size: 11px;
    color: var(--text-secondary);
    margin: 6px 0 2px 4px;
  }
  .bubble {
    padding: 8px 13px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.35;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg-row.me .bubble {
    background: var(--bubble-me);
    color: var(--bubble-me-text);
    border-bottom-right-radius: 4px;
  }
  .msg-row.them .bubble {
    background: var(--bubble-them);
    color: var(--bubble-them-text);
    border-bottom-left-radius: 4px;
  }
  .unsent-note {
    font-size: 12px;
    font-style: italic;
    color: var(--text-secondary);
    padding: 2px 4px;
  }
  .bubble.empty {
    font-style: italic;
    opacity: 0.7;
  }
  .att-img {
    display: block;
    max-width: 100%;
    max-height: 280px;
    border-radius: 14px;
    margin-bottom: 3px;
    cursor: pointer;
    object-fit: cover;
  }
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 48px 64px 20px;
    background: rgba(0, 0, 0, 0.88);
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 100%;
    max-height: calc(100vh - 110px);
    object-fit: contain;
    border-radius: 6px;
  }
  #lightbox .lb-caption {
    color: #e5e5ea;
    font-size: 12.5px;
    text-align: center;
  }
  #lightbox .lb-caption a { color: #8ab4ff; margin-left: 10px; }
  #lightbox button {
    position: absolute;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 20px;
    line-height: 40px;
    cursor: pointer;
  }
  #lightbox button:hover { background: rgba(255, 255, 255, 0.25); }
  #lightbox .lb-close { top: 12px; right: 14px; }
  #lightbox .lb-prev { left: 12px; top: 50%; transform: translateY(-50%); }
  #lightbox .lb-next { right: 12px; top: 50%; transform: translateY(-50%); }
  @media (max-width: 600px) {
    #lightbox { padding: 56px 16px 16px; }
    #lightbox .lb-prev, #lightbox .lb-next { top: auto; bottom: 14px; transform: none; }
  }
  .att-video, .att-audio {
    display: block;
    max-width: 100%;
    max-height: 280px;
    border-radius: 14px;
    margin-bottom: 3px;
  }
  .att-audio { width: 260px; height: 32px; }
  .att-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 14px;
    background: var(--bubble-them);
    color: var(--bubble-them-text);
    font-size: 13px;
    text-decoration: none;
    margin-bottom: 3px;
    max-width: fit-content;
  }
  .att-chip .att-size { color: var(--text-secondary); font-size: 11px; }
  .att-missing {
    padding: 8px 12px;
    border-radius: 14px;
    background: var(--bubble-them);
    color: var(--text-secondary);
    font-size: 12.5px;
    font-style: italic;
    margin-bottom: 3px;
    max-width: fit-content;
  }
  .reactions {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin: -2px 6px 4px;
  }
  .msg-row.me .reactions { justify-content: flex-end; }
  .reaction-pill {
    font-size: 12px;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: default;
  }
  .reply-quote {
    font-size: 12px;
    color: var(--text-secondary);
    border-left: 2px solid var(--border);
    padding: 2px 8px;
    margin: 4px 4px 3px;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .reply-quote:hover { color: var(--text); }
  .msg-row.flash .bubble { outline: 2px solid var(--accent); }
  .msg-time {
    font-size: 10px;
    color: var(--text-secondary);
    text-align: center;
    margin: 10px 0 2px;
  }

  #empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>iMessage Vault</h1>
      <input id="search" type="text" placeholder="Search conversations or text…">
      <label id="spam-toggle">
        <input type="checkbox" id="hide-automated" checked>
        Hide automated / marketing (<span id="automated-count"></span>)
      </label>
      <select id="screen-time-filter" title="Screen Time and Ask to Buy requests (&quot;… asked for more time for …&quot;, &quot;… asked to get the app …&quot;)">
        <option value="hide">Hide Screen Time requests</option>
        <option value="all">Show all messages</option>
        <option value="only">Only Screen Time requests</option>
      </select>
    </div>
    <div id="meta"></div>
    <div id="chat-list"></div>
  </div>
  <div id="thread">
    <div id="empty-state">Select a conversation</div>
  </div>
</div>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo">
  <button class="lb-close" aria-label="Close">✕</button>
  <button class="lb-prev" aria-label="Previous photo">‹</button>
  <button class="lb-next" aria-label="Next photo">›</button>
  <img alt="">
  <div class="lb-caption"></div>
</div>

<script src="messages_data.js"></script>
<script>
const DATA = window.MESSAGES_DATA;
const chatListEl = document.getElementById('chat-list');
const threadEl = document.getElementById('thread');
const searchEl = document.getElementById('search');
const metaEl = document.getElementById('meta');
const hideAutomatedEl = document.getElementById('hide-automated');
const automatedCountEl = document.getElementById('automated-count');
const screenTimeEl = document.getElementById('screen-time-filter');

let selectedChatId = null;

const sortedChats = [...DATA.chats].sort((a, b) => {
  return (parseDate(b._last_date) || 0) - (parseDate(a._last_date) || 0);
});

// Manual spam/automated overrides, kept per-browser (this data never leaves your machine).
const SPAM_KEY = 'imessage_viewer_spam_overrides';
function loadSpamOverrides() {
  try { return JSON.parse(localStorage.getItem(SPAM_KEY) || '{}'); } catch { return {}; }
}
function saveSpamOverrides(obj) {
  try { localStorage.setItem(SPAM_KEY, JSON.stringify(obj)); } catch { /* private browsing, etc. */ }
}
let spamOverrides = loadSpamOverrides();

// Screen Time request filter (hide / all / only), remembered per-browser.
const SCREEN_TIME_KEY = 'imessage_viewer_screen_time_filter';
const screenTimeCount = DATA.chats.reduce((n, c) => n + c.messages.filter(m => m.screen_time).length, 0);
try { screenTimeEl.value = localStorage.getItem(SCREEN_TIME_KEY) || 'hide'; } catch { /* private browsing, etc. */ }
if (!screenTimeEl.value) screenTimeEl.value = 'hide';
screenTimeEl.options[2].textContent = `Only Screen Time requests (${screenTimeCount})`;

function visibleMessages(c) {
  const mode = screenTimeEl.value;
  if (mode === 'hide') return c.messages.filter(m => !m.screen_time);
  if (mode === 'only') return c.messages.filter(m => m.screen_time);
  return c.messages;
}

function lastVisibleDate(c) {
  if (screenTimeEl.value === 'all') return c._last_date;
  const msgs = visibleMessages(c);
  return msgs.length ? msgs[msgs.length - 1].date : null;
}

function isAutomated(c) {
  const ov = spamOverrides[c.chat_id];
  return ov !== undefined ? ov : c.is_automated;
}

function refreshAutomatedCount() {
  automatedCountEl.textContent = sortedChats.filter(isAutomated).length;
}
refreshAutomatedCount();
metaEl.textContent = `${DATA.chat_count} conversations`;

function previewText(c) {
  const msgs = visibleMessages(c);
  const last = msgs[msgs.length - 1];
  const cleaned = screenTimeEl.value === 'all' ? cleanText(c._last_preview) : cleanText((last && last.text || '').slice(0, 120));
  if (cleaned) return cleaned;
  const atts = last ? last.attachments : null;
  if (atts && atts.length) {
    const kind = atts[0].kind;
    const icon = kind === 'image' ? '📷' : kind === 'video' ? '🎥' : kind === 'audio' ? '🎵' : '📎';
    return atts.length === 1 ? `${icon} Attachment` : `${icon} ${atts.length} attachments`;
  }
  return '';
}

// The export writes UTC timestamps with no zone suffix ("2026-10-05T14:14:26.051000"),
// which browsers would read as local time. Treat suffix-less timestamps as UTC.
function parseDate(iso) {
  if (!iso) return null;
  const hasZone = /(Z|[+-]\d\d:?\d\d)$/.test(iso);
  return new Date(hasZone ? iso : iso.replace(/(\.\d{3})\d+$/, '$1') + 'Z');
}

function fmtListDate(iso) {
  if (!iso) return '';
  const d = parseDate(iso);
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  const diffDays = (now - d) / 86400000;
  if (diffDays < 1 && d.getDate() === now.getDate()) {
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  return d.toLocaleDateString([], sameYear ? { month: 'short', day: 'numeric' } : { year: 'numeric', month: 'short', day: 'numeric' });
}

function fmtDayDivider(iso) {
  const d = parseDate(iso);
  return d.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function fmtTime(iso) {
  const d = parseDate(iso);
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

// Time of a read/delivered/edited event: just the time if it's the same day
// as the message, otherwise with the date too.
function fmtEventTime(iso, messageDate) {
  const e = parseDate(iso);
  if (e.toDateString() === messageDate.toDateString()) return fmtTime(iso);
  const sameYear = e.getFullYear() === messageDate.getFullYear();
  return e.toLocaleString([], sameYear
    ? { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }
    : { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

// "9:14 AM · Edited · Read 9:20 AM" under the message; hover for full dates.
function renderMessageMeta(m, d) {
  const parts = [fmtTime(m.date)];
  const details = [`${m.from_me ? 'Sent' : 'Received'}: ${d.toLocaleString()}`];
  if (m.date_edited) {
    parts.push('Edited');
    details.push(`Edited: ${parseDate(m.date_edited).toLocaleString()}`);
  }
  if (m.date_delivered) details.push(`Delivered: ${parseDate(m.date_delivered).toLocaleString()}`);
  if (m.date_read) {
    parts.push(`Read ${fmtEventTime(m.date_read, d)}`);
    details.push(`Read${m.from_me ? '' : ' by you'}: ${parseDate(m.date_read).toLocaleString()}`);
  } else if (m.from_me && m.date_delivered) {
    parts.push('Delivered');
  }
  const meta = document.createElement('div');
  meta.className = 'msg-time';
  meta.textContent = parts.join(' · ');
  meta.title = details.join('\n');
  return meta;
}

function renderChatList(filter) {
  const q = (filter || '').toLowerCase().trim();
  chatListEl.innerHTML = '';
  const frag = document.createDocumentFragment();

  let list = sortedChats;
  if (screenTimeEl.value !== 'all') {
    // Re-sort by the last message still shown, so a chat whose newest
    // messages are hidden doesn't sit at the top with an older date.
    list = list
      .map(c => ({ c, last: parseDate(lastVisibleDate(c)) }))
      .filter(x => x.last)
      .sort((a, b) => b.last - a.last)
      .map(x => x.c);
  }
  if (hideAutomatedEl.checked) {
    list = list.filter(c => !isAutomated(c));
  }
  if (q) {
    list = list.filter(c => {
      if ((c.name || '').toLowerCase().includes(q)) return true;
      if ((c.identifier || '').toLowerCase().includes(q)) return true;
      return visibleMessages(c).some(m => m.text && m.text.toLowerCase().includes(q));
    });
  }

  for (const c of list) {
    const item = document.createElement('div');
    item.className = 'chat-item' + (c.chat_id === selectedChatId ? ' selected' : '');
    item.dataset.chatId = c.chat_id;
    item.innerHTML = `
      <div class="row1">
        <div class="name">${isAutomated(c) ? '<span class="auto-badge">auto</span> ' : ''}${escapeHtml(c.name || 'Unknown')}</div>
        <div class="date">${fmtListDate(lastVisibleDate(c))}</div>
      </div>
      <div class="preview">${escapeHtml(previewText(c))}</div>
    `;
    item.addEventListener('click', () => selectChat(c.chat_id));
    frag.appendChild(item);
  }
  chatListEl.appendChild(frag);
}

function cleanText(t) {
  if (!t) return '';
  // ￼ marks an inline attachment, � a decode failure. Strip both, keep real text.
  return t.replace(/[￼�]/g, '').trim();
}

function attachmentPlaceholderCount(t) {
  if (!t) return 0;
  const matches = t.match(/￼/g);
  return matches ? matches.length : 0;
}

function fmtSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

// Attachment filenames can contain '#', '?' or '%', which would otherwise be read as URL syntax.
function assetUrl(p) {
  return p.split('/').map(encodeURIComponent).join('/');
}

function renderAttachment(a) {
  const el = document.createElement('div');
  if (!a.available || !a.path) {
    el.className = 'att-missing';
    el.textContent = `${a.name} (unavailable, moved or offloaded before export)`;
    return el;
  }

  if (a.kind === 'image') {
    // Clicking opens the photo in the in-page lightbox; Cmd/Ctrl-click still
    // opens the original in a new tab.
    const link = document.createElement('a');
    link.className = 'att-img-link';
    link.href = assetUrl(a.path);
    link.target = '_blank';
    link.dataset.display = assetUrl(a.preview_path || a.path);
    link.dataset.name = a.name;
    const img = document.createElement('img');
    img.className = 'att-img';
    img.loading = 'lazy';
    img.src = link.dataset.display;
    img.alt = a.name;
    link.appendChild(img);
    link.addEventListener('click', e => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      openLightbox(link);
    });
    return link;
  }
  if (a.kind === 'video') {
    const video = document.createElement('video');
    video.className = 'att-video';
    video.controls = true;
    video.preload = 'metadata';
    video.src = assetUrl(a.path);
    return video;
  }
  if (a.kind === 'audio') {
    const audio = document.createElement('audio');
    audio.className = 'att-audio';
    audio.controls = true;
    audio.src = assetUrl(a.path);
    return audio;
  }
  const chip = document.createElement('a');
  chip.className = 'att-chip';
  chip.href = assetUrl(a.path);
  chip.target = '_blank';
  const isPlugin = a.name.toLowerCase().endsWith('.pluginpayloadattachment');
  chip.innerHTML = `📎 ${escapeHtml(isPlugin ? 'Shared content' : a.name)} <span class="att-size">${fmtSize(a.size)}</span>`;
  return chip;
}

// In-page photo viewer. Steps through the photos in the open conversation.
const lightboxEl = document.getElementById('lightbox');
const lightboxImg = lightboxEl.querySelector('img');
const lightboxCaption = lightboxEl.querySelector('.lb-caption');
let lightboxLinks = [];
let lightboxIndex = 0;

function openLightbox(link) {
  lightboxLinks = [...threadEl.querySelectorAll('a.att-img-link')];
  lightboxIndex = Math.max(0, lightboxLinks.indexOf(link));
  showLightboxPhoto();
  lightboxEl.classList.add('open');
  lightboxEl.querySelector('.lb-close').focus();
}

function showLightboxPhoto() {
  const link = lightboxLinks[lightboxIndex];
  lightboxImg.src = link.dataset.display;
  lightboxImg.alt = link.dataset.name;
  const row = link.closest('.msg-row');
  const time = row && row.querySelector('.msg-time');
  const count = lightboxLinks.length > 1 ? `${lightboxIndex + 1} of ${lightboxLinks.length} · ` : '';
  lightboxCaption.innerHTML = `${count}${escapeHtml(time ? time.title.split('\n')[0] : link.dataset.name)}`
    + `<a href="${link.getAttribute('href')}" target="_blank">Open original</a>`;
  const multiple = lightboxLinks.length > 1;
  lightboxEl.querySelector('.lb-prev').style.display = multiple ? '' : 'none';
  lightboxEl.querySelector('.lb-next').style.display = multiple ? '' : 'none';
}

function stepLightbox(delta) {
  if (lightboxLinks.length < 2) return;
  lightboxIndex = (lightboxIndex + delta + lightboxLinks.length) % lightboxLinks.length;
  showLightboxPhoto();
}

function closeLightbox() {
  lightboxEl.classList.remove('open');
  lightboxImg.removeAttribute('src');
}

lightboxEl.querySelector('.lb-close').addEventListener('click', closeLightbox);
lightboxEl.querySelector('.lb-prev').addEventListener('click', () => stepLightbox(-1));
lightboxEl.querySelector('.lb-next').addEventListener('click', () => stepLightbox(1));
lightboxEl.addEventListener('click', e => { if (e.target === lightboxEl) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lightboxEl.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') stepLightbox(-1);
  else if (e.key === 'ArrowRight') stepLightbox(1);
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

const REACTION_EMOJI = {
  love: '❤️', like: '👍', dislike: '👎', laugh: '😂',
  emphasize: '‼️', question: '❓', sticker: '🖼️', other: '•',
};

function displaySender(m) {
  return m.from_me ? 'You' : (m.sender_name || m.sender || 'Unknown');
}

// Reactions are stored as their own messages pointing at a target GUID. Fold
// them onto their targets, replaying adds and removals in order, and hide the
// reaction rows themselves. A reaction whose target isn't in this chat (e.g.
// the target was deleted) is left as a normal row so nothing disappears.
function collectReactions(chat, byGuid) {
  const onTarget = new Map();
  const hidden = new Set();
  for (const m of chat.messages) {
    const r = m.reaction;
    if (!r || !byGuid.has(r.target)) continue;
    hidden.add(m);
    if (!onTarget.has(r.target)) onTarget.set(r.target, new Map());
    const perTarget = onTarget.get(r.target);
    const key = `${m.from_me ? 'me' : m.sender}|${r.type}|${r.emoji || ''}`;
    if (r.removed) perTarget.delete(key);
    else perTarget.set(key, { emoji: r.emoji || REACTION_EMOJI[r.type] || '•', who: displaySender(m) });
  }
  return { onTarget, hidden };
}

function renderReactions(reactions) {
  const groups = new Map();
  for (const { emoji, who } of reactions.values()) {
    if (!groups.has(emoji)) groups.set(emoji, []);
    groups.get(emoji).push(who);
  }
  const el = document.createElement('div');
  el.className = 'reactions';
  for (const [emoji, people] of groups) {
    const pill = document.createElement('span');
    pill.className = 'reaction-pill';
    pill.textContent = people.length > 1 ? `${emoji} ${people.length}` : emoji;
    pill.title = people.join(', ');
    el.appendChild(pill);
  }
  return el;
}

function renderReplyQuote(original, messagesEl) {
  const el = document.createElement('div');
  el.className = 'reply-quote';
  const text = cleanText(original.text) || (original.attachments && original.attachments.length ? '📎 Attachment' : '…');
  el.textContent = `↪ ${displaySender(original)}: ${text}`;
  el.title = 'Jump to original message';
  el.addEventListener('click', () => {
    const target = messagesEl.querySelector(`[data-guid="${CSS.escape(original.guid)}"]`);
    if (!target) return;
    target.scrollIntoView({ block: 'center' });
    target.classList.add('flash');
    setTimeout(() => target.classList.remove('flash'), 1200);
  });
  return el;
}

function selectChat(chatId) {
  selectedChatId = chatId;
  document.querySelectorAll('.chat-item').forEach(el => {
    el.classList.toggle('selected', Number(el.dataset.chatId) === chatId);
  });
  const chat = DATA.chats.find(c => c.chat_id === chatId);
  renderThread(chat);
}

function renderThread(chat) {
  const automated = isAutomated(chat);
  const shown = visibleMessages(chat);
  threadEl.innerHTML = `
    <div id="thread-header">
      <div class="row1">
        <div>
          <div class="name">${automated ? '<span class="auto-badge">auto</span> ' : ''}${escapeHtml(chat.name || 'Unknown')}</div>
          <div class="sub">${shown.length} messages · ${escapeHtml(chat.identifier || '')}</div>
        </div>
        <button id="spam-btn" class="${automated ? 'is-spam' : ''}">${automated ? 'Not spam' : 'Mark as spam'}</button>
      </div>
    </div>
    <div id="messages"></div>
  `;
  threadEl.querySelector('#spam-btn').addEventListener('click', () => {
    spamOverrides[chat.chat_id] = !isAutomated(chat);
    saveSpamOverrides(spamOverrides);
    refreshAutomatedCount();
    renderThread(chat);
    renderChatList(searchEl.value);
  });
  const messagesEl = threadEl.querySelector('#messages');
  const frag = document.createDocumentFragment();
  const byGuid = new Map(chat.messages.filter(m => m.guid).map(m => [m.guid, m]));
  const { onTarget, hidden } = collectReactions(chat, byGuid);

  let lastDay = null;
  for (const m of shown) {
    if (hidden.has(m)) continue;
    const d = parseDate(m.date);
    const dayKey = d ? d.toDateString() : null;
    if (dayKey && dayKey !== lastDay) {
      const divider = document.createElement('div');
      divider.className = 'day-divider';
      divider.textContent = fmtDayDivider(m.date);
      frag.appendChild(divider);
      lastDay = dayKey;
    }

    const row = document.createElement('div');
    row.className = 'msg-row ' + (m.from_me ? 'me' : 'them');
    if (m.guid) row.dataset.guid = m.guid;

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    if (!m.from_me && chat.messages.some(x => !x.from_me && x.sender !== m.sender)) {
      const label = document.createElement('div');
      label.className = 'sender-label';
      label.textContent = m.sender_name || m.sender || 'Unknown';
      wrap.appendChild(label);
    }

    const original = m.reply_to && byGuid.get(m.reply_to);
    if (original) wrap.appendChild(renderReplyQuote(original, messagesEl));

    const hasAttachments = m.attachments && m.attachments.length > 0;
    if (hasAttachments) {
      for (const a of m.attachments) {
        wrap.appendChild(renderAttachment(a));
      }
    }

    const cleaned = cleanText(m.text);
    const hasText = cleaned.length > 0;
    if (hasText) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = cleaned;
      wrap.appendChild(bubble);
    } else if (m.unsent) {
      const bubble = document.createElement('div');
      bubble.className = 'unsent-note';
      bubble.textContent = m.from_me ? 'You unsent a message' : `${m.sender_name || m.sender || 'Someone'} unsent a message`;
      wrap.appendChild(bubble);
    } else if (!hasAttachments) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble empty';
      bubble.textContent = '[no text, reaction or unreadable message]';
      wrap.appendChild(bubble);
    }
    const reactions = m.guid && onTarget.get(m.guid);
    if (reactions && reactions.size) wrap.appendChild(renderReactions(reactions));
    if (d) wrap.appendChild(renderMessageMeta(m, d));
    row.appendChild(wrap);
    frag.appendChild(row);
  }
  messagesEl.appendChild(frag);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

searchEl.addEventListener('input', () => renderChatList(searchEl.value));
hideAutomatedEl.addEventListener('change', () => renderChatList(searchEl.value));
screenTimeEl.addEventListener('change', () => {
  try { localStorage.setItem(SCREEN_TIME_KEY, screenTimeEl.value); } catch { /* private browsing, etc. */ }
  renderChatList(searchEl.value);
  const chat = selectedChatId != null && DATA.chats.find(c => c.chat_id === selectedChatId);
  if (chat && visibleMessages(chat).length) renderThread(chat);
  else { selectedChatId = null; threadEl.innerHTML = '<div id="empty-state">Select a conversation</div>'; }
});

renderChatList('');
</script>
</body>
